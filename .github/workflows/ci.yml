name: CI

"on":
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      memory-lab:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agent_memory_lab
          POSTGRES_USER: agent_memory_lab
          POSTGRES_PASSWORD: ci-memory-lab-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_memory_lab -d agent_memory_lab"
          --health-interval 10s --health-timeout 5s --health-retries 5
      memory-cutover-lab:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agent_memory
          POSTGRES_USER: agent_memory
          POSTGRES_PASSWORD: ci-cutover-lab-only
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U agent_memory -d agent_memory"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      APP_ENV: test
      ENABLE_DEV_ACCOUNTS: "false"
      MEMORY_BACKEND: sqlite
      CONVERSATION_BACKEND: sqlite
      OPENAI_API_KEY: ""
      MEMORY_TEST_DATABASE_URL: postgresql://agent_memory_lab:ci-memory-lab-only@127.0.0.1:5432/agent_memory_lab
      MEMORY_PRODUCT_TEST_DATABASE_URL: postgresql://agent_memory:ci-cutover-lab-only@127.0.0.1:5433/agent_memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-api.txt
            requirements-workflow.txt
            eval/requirements-memory.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-api.txt -r eval/requirements-memory.txt
      - name: Run backend and PostgreSQL contract tests
        run: python -m unittest discover -s tests -p 'test_*.py' -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:markdown
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile memory --profile memory-store --profile monitor config -q
